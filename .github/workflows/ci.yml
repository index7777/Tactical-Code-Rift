name: P11.4 finalization artifact

on:
  pull_request:
    branches: [main]

jobs:
  finalize:
    if: github.head_ref == 'feat/p11-4-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p11-4-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one-shot production migration
        run: |
          awk 'BEGIN{capture=0} /python - <<.PY./{capture=1;next} capture && /^[[:space:]]*PY$/{capture=0;exit} capture{sub(/^          /,"");print}' .github/workflows/source-cleanup.yml > /tmp/p11-finalize.py
          python /tmp/p11-finalize.py
          rm -f src/presentation/runtime/P11RuntimeWiring.ts src/presentation/runtime/ProductionRuntime.ts .github/workflows/source-cleanup.yml
      - name: Audit production source
        run: |
          test ! -e src/presentation/runtime/P11RuntimeWiring.ts
          test ! -e src/presentation/runtime/ProductionRuntime.ts
          ! grep -R -n -E 'boss-proof|multi-cover-proof|result-proof|death-proof|relay-proof|card-proof|monster-proof|outcome-proof|draw-proof|keydown-Q|keydown-W|keydown-A|keydown-S|P−|P\+|E−|E\+|setTint\(0xff5060\)|drawCommandSlots' src
      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test
      - name: Stage finalization artifact
        run: |
          mkdir -p /tmp/p11-final/src/presentation/scenes /tmp/p11-final/src/presentation/battle /tmp/p11-final/src/core/route
          cp src/presentation/scenes/BootScene.ts /tmp/p11-final/src/presentation/scenes/BootScene.ts
          cp src/presentation/battle/OutcomePresenter.ts /tmp/p11-final/src/presentation/battle/OutcomePresenter.ts
          cp src/presentation/battle/OutcomeLayout.ts /tmp/p11-final/src/presentation/battle/OutcomeLayout.ts
          cp src/presentation/battle/OutcomeLayout.test.ts /tmp/p11-final/src/presentation/battle/OutcomeLayout.test.ts
          cp src/core/route/EncounterCatalog.test.ts /tmp/p11-final/src/core/route/EncounterCatalog.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: p11-final-source
          path: /tmp/p11-final
          if-no-files-found: error
