name: P11.4 source finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/p11-4-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p11-4-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated production migration
        run: |
          awk 'BEGIN{capture=0} /python - <<.PY./{capture=1;next} capture && /^[[:space:]]*PY$/{capture=0;exit} capture{sub(/^          /,"");print}' .github/workflows/source-cleanup.yml > /tmp/p11-finalize.py
          python /tmp/p11-finalize.py
          rm -f src/presentation/runtime/P11RuntimeWiring.ts src/presentation/runtime/ProductionRuntime.ts
      - name: Audit production source
        run: |
          test ! -e src/presentation/runtime/P11RuntimeWiring.ts
          test ! -e src/presentation/runtime/ProductionRuntime.ts
          ! grep -R -n -E 'boss-proof|multi-cover-proof|result-proof|death-proof|relay-proof|card-proof|monster-proof|outcome-proof|draw-proof|keydown-Q|keydown-W|keydown-A|keydown-S|P−|P\+|E−|E\+|setTint\(0xff5060\)|drawCommandSlots' src
      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test
      - name: Keep workflow files out of the source commit
        run: |
          git checkout -- .github/workflows/ci.yml .github/workflows/source-cleanup.yml
      - name: Commit production source batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: finalize P11.4 combat and route runtime"
          git push origin HEAD:feat/p11-4-integration
