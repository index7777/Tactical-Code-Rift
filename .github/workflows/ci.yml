name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/p11-4-integration]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize approved Redleaf assets
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/redleaf-production-assets'
        run: npm run prepare:redleaf
      - name: Upload Redleaf production assets
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/redleaf-production-assets'
        uses: actions/upload-artifact@v4
        with:
          name: redleaf-production-assets
          path: |
            public/assets/battle/generated/characters/redleaf/*.svg
            public/assets/battle/generated/characters/redleaf/production/*.svg
            public/assets/battle/portraits/redleaf-p11-4-current.svg
            public/assets/battle/portraits/redleaf-p11-4-timeline.svg
          if-no-files-found: error
      - run: npm run build
      - run: npm test
