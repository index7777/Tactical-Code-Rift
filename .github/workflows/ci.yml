name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/p11-4-integration]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Integrate production BootScene and remove prototype tooling
        if: github.ref_name == 'feat/p11-4-integration' || github.head_ref == 'feat/p11-4-integration'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('src/presentation/scenes/BootScene.ts')
          s=path.read_text(encoding='utf-8')

          s=s.replace("import{createTeamDeck,createTeamDeckState,refillHand,commitPlayedCards,type BattleCard,type TeamDeckState}from'../../core/cards/BattleCards';","import{createTeamDeckState,refillHand,commitPlayedCards,type BattleCard,type TeamDeckState}from'../../core/cards/BattleCards';")
          s=s.replace("import{dealEnemySkillsForArchetypes,enemyArchetypePools}from'../../core/battle/EnemySkills';","import{dealEnemySkillsForArchetypes}from'../../core/battle/EnemySkills';")
          s=s.replace("import{BattlefieldPresenter}from'../battle/BattlefieldPresenter';import{normalizeBattlefieldMode,type BattlefieldMode}from'../battle/BattlefieldMode';","import{BattlefieldPresenter}from'../battle/BattlefieldPresenter';import type{BattlefieldMode}from'../battle/BattlefieldMode';")
          marker="import{shouldStartJourney}from'../../core/route/EntryMode';"
          if "../../core/route/EncounterCatalog" not in s:
              if marker not in s: raise SystemExit('EntryMode import marker missing')
              s=s.replace(marker,marker+"\nimport{storyEncounter}from'../../core/route/EncounterCatalog';",1)

          init_new="""init(data?:{battlefield?:BattlefieldMode;journeyNodeId?:string}){
  this.requestedBattlefield=data?.battlefield;
  this.journeyNodeId=data?.journeyNodeId;
  this.pc=4;
  const encounter=storyEncounter(this.journeyNodeId);
  this.ec=encounter?.enemies.length??4;
  if(encounter&&!data?.battlefield)this.requestedBattlefield=encounter.battlefield;
  this.selectedBattleMusicKey=battleMusicKey(battleMusicKind(this.journeyNodeId))
}"""
          init_pattern=r"init\(data\?:\{battlefield\?:BattlefieldMode;journeyNodeId\?:string(?:;pc\?:number;ec\?:number)?\}\)\{.*?\n\}"
          s,count=re.subn(init_pattern,init_new,s,count=1,flags=re.S)
          if count!=1: raise SystemExit('BootScene init marker missing')

          s=s.replace("private toolsVisible=false;","")
          s=re.sub(r"\nprivate toolKey\?:Phaser\.Input\.Keyboard\.Key;private toolsInitialized=false;\nupdate\(\)\{.*?\}\nprivate setDevTools\(visible:boolean\)\{.*?\}\n(?=preload\(\))","\n",s,flags=re.S)

          card_icons="for(const id of ['power','tempo','damage','balance','shield','intercept','relay','restore'])this.load.image(`card-icon-${id}`,`assets/battle/cards/icons/${id}.svg`);"
          enemy_fx="for(const id of ['wet-corpse','lantern-child','mountain-hound','wayfarer-umbrella','noose-ghost','lost-monk','rain-warrior','rain-boss'])this.load.image(`fx-p11-enemy-${id}`,`assets/battle/fx/enemy/p11-${id}-slash.svg`);"
          card_frames="for(const family of ['attack','defense','support','tactics'])this.load.image(`card-frame-${family}`,`assets/battle/cards/frames/${family}.svg`);"
          if enemy_fx not in s:
              if card_icons not in s: raise SystemExit('card icon preload marker missing')
              s=s.replace(card_icons,card_icons+enemy_fx,1)
          if card_frames not in s:
              if enemy_fx not in s: raise SystemExit('enemy FX preload marker missing')
              s=s.replace(enemy_fx,enemy_fx+card_frames,1)

          s=s.replace("this.battlefieldMode=this.requestedBattlefield??normalizeBattlefieldMode(new URLSearchParams(window.location.search).get('scene'));","this.battlefieldMode=this.requestedBattlefield??'rooftop';")
          for line in [
              "    this.input.keyboard?.on('keydown-Q',()=>this.scene.restart({pc:Math.max(1,this.pc-1),ec:this.ec}));\n",
              "    this.input.keyboard?.on('keydown-W',()=>this.scene.restart({pc:Math.min(4,this.pc+1),ec:this.ec}));\n",
              "    this.input.keyboard?.on('keydown-A',()=>this.scene.restart({pc:this.pc,ec:Math.max(1,this.ec-1)}));\n",
              "    this.input.keyboard?.on('keydown-S',()=>this.scene.restart({pc:this.pc,ec:Math.min(4,this.ec+1)}));\n",
              "    this.hudLayer.add(this.button(1110,8,145,'重新開始',()=>this.scene.restart({pc:this.pc,ec:this.ec})));\n",
              "    this.hudLayer.add(this.button(805,8,36,'P−',()=>this.scene.restart({pc:Math.max(1,this.pc-1),ec:this.ec})));\n",
              "    this.hudLayer.add(this.button(850,8,36,'P+',()=>this.scene.restart({pc:Math.min(4,this.pc+1),ec:this.ec})));\n",
              "    this.hudLayer.add(this.button(905,8,36,'E−',()=>this.scene.restart({pc:this.pc,ec:Math.max(1,this.ec-1)}),0x713141));\n",
              "    this.hudLayer.add(this.button(950,8,36,'E+',()=>this.scene.restart({pc:this.pc,ec:Math.min(4,this.ec+1)}),0x713141));\n",
          ]: s=s.replace(line,'')

          start=s.index('private rebuild(){')
          end=s.index('\nprivate addActor',start)
          rebuild="""private rebuild(){
  if(this.busy)return;
  this.world.each((x:any)=>{if(x instanceof Phaser.GameObjects.Container&&x.getData('actor'))x.destroy()});this.players.clear();this.enemies.clear();
  const encounter=storyEncounter(this.journeyNodeId);
  const enemyRoles:EnemyArchetype[]=encounter?.enemies??['wet-corpse','lantern-child'];
  this.ec=enemyRoles.length;
  const ps:Fighter[]=Array.from({length:this.pc},(_,i)=>({id:`P${String.fromCharCode(65+i)}`,team:'player',actorIndex:i,speed:Phaser.Math.Between(4,9),alive:true}));
  const roleSpeed=(role:EnemyArchetype)=>role==='lantern-child'||role==='mountain-hound'?Phaser.Math.Between(7,9):role==='wayfarer-umbrella'||role==='rain-warrior'||role==='rain-boss'?Phaser.Math.Between(3,5):Phaser.Math.Between(5,7);
  const es:Fighter[]=enemyRoles.map((role,i)=>({id:`E${String.fromCharCode(65+i)}`,team:'enemy',actorIndex:i,archetype:role,speed:roleSpeed(role),alive:true}));
  const roundSkills=dealEnemySkillsForArchetypes(enemyRoles);
  const skills=new Map(es.map((e,i)=>{const skill=roundSkills[i]!,target=Phaser.Math.RND.pick(ps);return[e.id,{id:`${e.id}-skill`,...skill,targetId:target.id}]}));
  this.timeline=buildRoundTimeline(ps,es,skills);ps.forEach(f=>this.addActor(f));es.forEach(f=>this.addActor(f));
  this.deck=refillHand(this.deck,5);
  this.commands.clear();this.planning=this.timeline.filter(n=>n.team==='player').sort((a,b)=>b.speed-a.speed);this.planIndex=0;this.selected=undefined;this.discardMode=false;this.discardUsedThisRound=false;this.updateUndoVisibility();this.renderTimeline();this.renderHand();this.focus();this.renderEnemyIntents()
}"""
          s=s[:start]+rebuild+s[end:]
          s=s.replace("hasMasterTexture=rainfallMonster&&monsterKey&&this.textures.exists(monsterKey)&&!['rain-boss'].includes(f.archetype??''),","hasMasterTexture=rainfallMonster&&Boolean(monsterKey)&&this.textures.exists(monsterKey),")

          old_timeline="""      this.timelineLayer.add(this.add.rectangle(82,42,124,76,0x091117,.99).setStrokeStyle(2,teamColor,.96));
      this.timelineLayer.add(this.add.rectangle(42,42,70,70,0x02070b,1));
      if(key&&this.textures.exists(key))this.timelineLayer.add(this.add.image(42,42,key).setDisplaySize(68,68));"""
          new_timeline="""      this.timelineLayer.add(this.add.polygon(42,42,[0,-35,35,0,0,35,-35,0],0x02070b,1).setStrokeStyle(3,teamColor,.98));
      if(key&&this.textures.exists(key)){const maskShape=this.add.graphics().fillStyle(0xffffff,1).fillPoints([new Phaser.Math.Vector2(42,7),new Phaser.Math.Vector2(77,42),new Phaser.Math.Vector2(42,77),new Phaser.Math.Vector2(7,42)],true).setVisible(false);const portrait=this.add.image(42,42,key).setDisplaySize(70,70).setMask(maskShape.createGeometryMask());this.timelineLayer.add([maskShape,portrait]);this.timelineLayer.add(this.add.polygon(42,42,[0,-35,35,0,0,35,-35,0],0xffffff,0).setStrokeStyle(2,teamColor,1))} """
          if old_timeline in s:s=s.replace(old_timeline,new_timeline,1)
          elif "add.polygon(42,42,[0,-35,35,0,0,35,-35,0]" not in s:raise SystemExit('current actor portrait marker missing')

          frame_marker="const frame=this.add.graphics();frame.fillStyle(p.base,invalid?.58:.98).fillRoundedRect(-60,-75,120,150,9);frame.lineStyle(selected?3:1.5,selected?0xf0d47c:p.frame,selected?1:.82).strokeRoundedRect(-60,-75,120,150,9);frame.fillStyle(0x05090d,.72).fillRoundedRect(-54,-69,108,24,5);frame.fillStyle(p.accent,.9).fillRect(-55,-70,4,138);frame.lineStyle(1,p.accent,.35).lineBetween(-51,-40,51,-40);group.add(frame);"
          if "skinKey=`card-frame-${family}`" not in s:
              if frame_marker not in s: raise SystemExit('card frame marker missing')
              s=s.replace(frame_marker,frame_marker+"const family=card.intent==='defense'?'defense':card.intent==='support'?'support':card.intent==='disruption'?'tactics':'attack',skinKey=`card-frame-${family}`;if(this.textures.exists(skinKey))group.add(this.add.image(0,0,skinKey).setDisplaySize(120,150).setAlpha(invalid?.4:.88));",1)

          s=s.replace("this.status.setText(`掩護 ${result.protectedActorId} ｜ 截斷 ${result.enemy.actorId} 的殺生線`);","this.status.setText('掩護成立｜已截斷殺生線');")
          s=s.replace("this.status.setText(`${actorId} 跳過｜下回合速度 +2（一次）`);","this.status.setText('跳過｜下回合速度 +2（一次）');")
          s=s.replace("this.status.setText(`${actorId} → ${targetId}${pursuitCount>1?`｜追擊 ${pursuitCount}`:''}${flank?'｜側襲':''}`);","this.status.setText([pursuitCount>1?`追擊 ${pursuitCount}`:'',flank?'側襲':''].filter(Boolean).join('｜'));")

          forbidden=['-proof','proof','dev-tool','toolsVisible','setDevTools','toolsInitialized','toolKey','keydown-Q','keydown-W','keydown-A','keydown-S','P−','P+','E−','E+']
          leftovers=[token for token in forbidden if token in s]
          if leftovers: raise SystemExit('forbidden production-source tokens remain: '+', '.join(leftovers))
          path.write_text(s,encoding='utf-8')
          PY
          rm -f src/presentation/runtime/P11RuntimeWiring.ts src/presentation/runtime/ProductionRuntime.ts
      - name: Commit production source cleanup
        if: github.ref_name == 'feat/p11-4-integration' || github.head_ref == 'feat/p11-4-integration'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: physically remove prototype tooling"
          git push origin HEAD:feat/p11-4-integration
      - run: npm ci
      - run: npm run build
      - run: npm test
