name: Source cleanup

on:
  push:
    branches: [feat/p11-4-integration]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p11-4-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize production runtime source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/presentation/scenes/BootScene.ts')
          s=p.read_text(encoding='utf-8')

          # Production imports only.
          s=s.replace("import{createTeamDeck,createTeamDeckState,refillHand,commitPlayedCards,type BattleCard,type TeamDeckState}from'../../core/cards/BattleCards';","import{createTeamDeckState,refillHand,commitPlayedCards,type BattleCard,type TeamDeckState}from'../../core/cards/BattleCards';")
          s=s.replace("import{dealEnemySkillsForArchetypes,enemyArchetypePools}from'../../core/battle/EnemySkills';","import{dealEnemySkillsForArchetypes}from'../../core/battle/EnemySkills';")
          s=s.replace("import{BattlefieldPresenter}from'../battle/BattlefieldPresenter';import{normalizeBattlefieldMode,type BattlefieldMode}from'../battle/BattlefieldMode';","import{BattlefieldPresenter}from'../battle/BattlefieldPresenter';import type{BattlefieldMode}from'../battle/BattlefieldMode';")
          marker="import{shouldStartJourney}from'../../core/route/EntryMode';"
          if "../../core/route/EncounterCatalog" not in s:
              if marker not in s: raise SystemExit('EntryMode import marker missing')
              s=s.replace(marker,marker+"\nimport{storyEncounter}from'../../core/route/EncounterCatalog';",1)

          # Route data is the single source of truth for combat composition.
          s=re.sub(
              r"init\(data\?:\{battlefield\?:BattlefieldMode;journeyNodeId\?:string;pc\?:number;ec\?:number\}\)\{.*?\n\}",
              "init(data?:{battlefield?:BattlefieldMode;journeyNodeId?:string}){\n  this.requestedBattlefield=data?.battlefield;this.journeyNodeId=data?.journeyNodeId;this.pc=4;\n  const encounter=storyEncounter(this.journeyNodeId);this.ec=encounter?.enemies.length??4;if(encounter&&!data?.battlefield)this.requestedBattlefield=encounter.battlefield;\n  this.selectedBattleMusicKey=battleMusicKey(battleMusicKind(this.journeyNodeId))\n}",
              s,count=1,flags=re.S)
          s=s.replace("this.battlefieldMode=this.requestedBattlefield??normalizeBattlefieldMode(new URLSearchParams(window.location.search).get('scene'));","this.battlefieldMode=this.requestedBattlefield??'rooftop';")

          # P11.4 visible runtime assets.
          card_icons="for(const id of ['power','tempo','damage','balance','shield','intercept','relay','restore'])this.load.image(`card-icon-${id}`,`assets/battle/cards/icons/${id}.svg`);"
          enemy_fx="for(const id of ['wet-corpse','lantern-child','mountain-hound','wayfarer-umbrella','noose-ghost','lost-monk','rain-warrior','rain-boss'])this.load.image(`fx-p11-enemy-${id}`,`assets/battle/fx/enemy/p11-${id}-slash.svg`);"
          card_frames="for(const family of ['attack','defense','support','tactics'])this.load.image(`card-frame-${family}`,`assets/battle/cards/frames/${family}.svg`);"
          if "fx-p11-enemy-${id}" not in s:
              if card_icons not in s: raise SystemExit('card icon preload marker missing')
              s=s.replace(card_icons,card_icons+enemy_fx,1)
          if "card-frame-${family}" not in s:
              if enemy_fx not in s: raise SystemExit('enemy FX preload marker missing')
              s=s.replace(enemy_fx,enemy_fx+card_frames,1)

          # EncounterCatalog is the only enemy composition source.
          start=s.index('private rebuild(){');end=s.index('\nprivate addActor',start)
          rebuild="""private rebuild(){
  if(this.busy)return;
  this.world.each((x:any)=>{if(x instanceof Phaser.GameObjects.Container&&x.getData('actor'))x.destroy()});this.players.clear();this.enemies.clear();
  const encounter=storyEncounter(this.journeyNodeId);const enemyRoles:EnemyArchetype[]=encounter?.enemies??['wet-corpse','lantern-child'];this.ec=enemyRoles.length;
  const ps:Fighter[]=Array.from({length:this.pc},(_,i)=>({id:`P${String.fromCharCode(65+i)}`,team:'player',actorIndex:i,speed:Phaser.Math.Between(4,9),alive:true}));
  const roleSpeed=(role:EnemyArchetype)=>role==='lantern-child'||role==='mountain-hound'?Phaser.Math.Between(7,9):role==='wayfarer-umbrella'||role==='rain-warrior'||role==='rain-boss'?Phaser.Math.Between(3,5):Phaser.Math.Between(5,7);
  const es:Fighter[]=enemyRoles.map((role,i)=>({id:`E${String.fromCharCode(65+i)}`,team:'enemy',actorIndex:i,archetype:role,speed:roleSpeed(role),alive:true}));const roundSkills=dealEnemySkillsForArchetypes(enemyRoles);
  const skills=new Map(es.map((e,i)=>{const skill=roundSkills[i]!,target=Phaser.Math.RND.pick(ps);return[e.id,{id:`${e.id}-skill`,...skill,targetId:target.id}]}));
  this.timeline=buildRoundTimeline(ps,es,skills);ps.forEach(f=>this.addActor(f));es.forEach(f=>this.addActor(f));this.deck=refillHand(this.deck,5);
  this.commands.clear();this.planning=this.timeline.filter(n=>n.team==='player').sort((a,b)=>b.speed-a.speed);this.planIndex=0;this.selected=undefined;this.discardMode=false;this.discardUsedThisRound=false;this.updateUndoVisibility();this.renderTimeline();this.renderHand();this.focus();this.renderEnemyIntents()
}"""
          s=s[:start]+rebuild+s[end:]

          # Preserve delivered monster art colors. Hit feedback must never full-sprite tint enemies red.
          s=s.replace("hasMasterTexture=rainfallMonster&&monsterKey&&this.textures.exists(monsterKey)&&!['rain-boss'].includes(f.archetype??''),","hasMasterTexture=rainfallMonster&&Boolean(monsterKey)&&this.textures.exists(monsterKey),")
          red_hit="""    // 受擊 sprite 紅閃 110ms（永久 tint 有的怪物會保留原 tint，heroine 使用 poseLocked 也會被保留）。
    if(hpLoss>0&&a.sprite){const prev=a.sprite.tintTopLeft??0xffffff;a.sprite.setTint(0xff5060);this.time.delayedCall(110,()=>{if(!a.alive&&!deferDeath)return;if(prev===0xffffff)a.sprite.clearTint();else a.sprite.setTint(prev)})}
"""
          neutral_hit="""    // Neutral contact flash: preserve the authored sprite palette.
    if(hpLoss>0&&a.sprite){const prevAlpha=a.sprite.alpha;a.sprite.setAlpha(Math.min(prevAlpha,.62));this.tweens.add({targets:a.sprite,alpha:prevAlpha,duration:110,ease:'Quad.easeOut'})}
"""
          if red_hit in s:s=s.replace(red_hit,neutral_hit,1)
          if 'setTint(0xff5060)' in s:raise SystemExit('deprecated red hit tint remains')

          # Remove the extra party command strip from the card dock; actor state already lives in fighter HUD/current actor.
          s=re.sub(r"\nprivate drawCommandSlots\(\)\{.*?\n  \}\nprivate renderHand\(\)\{","\nprivate renderHand(){",s,count=1,flags=re.S)
          s=s.replace('    this.drawCommandSlots();\n','')

          # Current Actor panel: diamond language + real geometry mask.
          old_current="""      this.timelineLayer.add(this.add.rectangle(82,42,124,76,0x091117,.99).setStrokeStyle(2,teamColor,.96));
      this.timelineLayer.add(this.add.rectangle(42,42,70,70,0x02070b,1));
      if(key&&this.textures.exists(key))this.timelineLayer.add(this.add.image(42,42,key).setDisplaySize(68,68));"""
          new_current="""      this.timelineLayer.add(this.add.polygon(42,42,[0,-35,35,0,0,35,-35,0],0x02070b,1).setStrokeStyle(3,teamColor,.98));
      if(key&&this.textures.exists(key)){const maskShape=this.add.graphics().fillStyle(0xffffff,1).fillPoints([new Phaser.Math.Vector2(42,7),new Phaser.Math.Vector2(77,42),new Phaser.Math.Vector2(42,77),new Phaser.Math.Vector2(7,42)],true).setVisible(false);const portrait=this.add.image(42,42,key).setDisplaySize(70,70).setMask(maskShape.createGeometryMask());this.timelineLayer.add([maskShape,portrait]);this.timelineLayer.add(this.add.polygon(42,42,[0,-35,35,0,0,35,-35,0],0xffffff,0).setStrokeStyle(2,teamColor,1))}"""
          if old_current in s:s=s.replace(old_current,new_current,1)
          elif "add.polygon(42,42,[0,-35,35,0,0,35,-35,0]" not in s:raise SystemExit('current actor marker missing')

          # Card renderer: add production family skin above the semantic base frame.
          frame_marker="const frame=this.add.graphics();frame.fillStyle(p.base,invalid?.58:.98).fillRoundedRect(-60,-75,120,150,9);frame.lineStyle(selected?3:1.5,selected?0xf0d47c:p.frame,selected?1:.82).strokeRoundedRect(-60,-75,120,150,9);frame.fillStyle(0x05090d,.72).fillRoundedRect(-54,-69,108,24,5);frame.fillStyle(p.accent,.9).fillRect(-55,-70,4,138);frame.lineStyle(1,p.accent,.35).lineBetween(-51,-40,51,-40);group.add(frame);"
          if "skinKey=`card-frame-${family}`" not in s:
              if frame_marker not in s:raise SystemExit('card frame renderer marker missing')
              skin=frame_marker+"const family=card.intent==='defense'?'defense':card.intent==='support'?'support':card.intent==='disruption'?'tactics':'attack',skinKey=`card-frame-${family}`;if(this.textures.exists(skinKey))group.add(this.add.image(0,0,skinKey).setDisplaySize(120,150).setAlpha(invalid?.4:.9));"
              s=s.replace(frame_marker,skin,1)

          # Status ribbon is validation feedback only, never a battle log or internal ID channel.
          s=s.replace("this.status.setText(`掩護 ${result.protectedActorId} ｜ 截斷 ${result.enemy.actorId} 的殺生線`);","this.status.setText('掩護成立｜已截斷殺生線');")
          s=s.replace("this.status.setText(`${actorId} 跳過｜下回合速度 +2（一次）`);","this.status.setText('跳過｜下回合速度 +2（一次）');")
          s=s.replace("this.status.setText(`${actorId} → ${targetId}${pursuitCount>1?`｜追擊 ${pursuitCount}`:''}${flank?'｜側襲':''}`);","this.status.setText('');")

          forbidden=['boss-proof','multi-cover-proof','result-proof','death-proof','relay-proof','card-proof','monster-proof','outcome-proof','draw-proof','toolsVisible','setDevTools','toolsInitialized','toolKey','keydown-Q','keydown-W','keydown-A','keydown-S','P−','P+','E−','E+','drawCommandSlots','setTint(0xff5060)']
          leftovers=[x for x in forbidden if x in s]
          if leftovers:raise SystemExit('forbidden tokens remain: '+', '.join(leftovers))
          p.write_text(s,encoding='utf-8')

          # Outcome semantics: victory continues the journey; retry exists only on defeat.
          layout=Path('src/presentation/battle/OutcomeLayout.ts')
          layout.write_text("""export interface OutcomeButtonPosition{x:number;y:number;primary:boolean}\n\nexport function outcomeButtonLayout(result:'victory'|'defeat'):{retry?:OutcomeButtonPosition;continue?:OutcomeButtonPosition}{\n  if(result==='defeat')return{retry:{x:640,y:394,primary:true}};\n  return{continue:{x:640,y:394,primary:true}}\n}\n""",encoding='utf-8')

          presenter=Path('src/presentation/battle/OutcomePresenter.ts')
          presenter.write_text("""import Phaser from 'phaser';\nimport{outcomeButtonLayout}from'./OutcomeLayout';\n\nexport class OutcomePresenter {\n  constructor(private scene:Phaser.Scene,private hudLayer:Phaser.GameObjects.Container){}\n\n  async show(result:'victory'|'defeat',actions:{onRetry:()=>void;onContinue?:()=>void}){\n    const victory=result==='victory',layout=outcomeButtonLayout(result);this.scene.cameras.main.stopFollow();this.scene.cameras.main.centerOn(640,360);this.scene.cameras.main.setZoom(1);\n    const overlay=this.scene.add.rectangle(640,360,1280,720,0x050812,.48).setDepth(180).setAlpha(0).setScrollFactor(0);\n    const title=this.scene.add.text(640,302,victory?'戰鬥勝利':'全隊斷命',{fontFamily:'serif',fontSize:'42px',fontStyle:'bold',color:victory?'#ffe6a1':'#ff91a4',stroke:'#080b12',strokeThickness:7}).setOrigin(.5).setDepth(181).setAlpha(0).setScale(.8);\n    title.setScrollFactor(0);const buttons:Phaser.GameObjects.GameObject[]=[];\n    if(!victory&&layout.retry){const retry=this.scene.add.text(layout.retry.x,layout.retry.y,'再戰',{fixedWidth:240,align:'center',fontFamily:'sans-serif',fontSize:'21px',color:'#fff',backgroundColor:'#713141',padding:{y:16}}).setOrigin(.5).setDepth(181).setAlpha(0).setScrollFactor(0).setInteractive({useHandCursor:true});retry.on('pointerdown',actions.onRetry);buttons.push(retry)}\n    if(victory&&actions.onContinue&&layout.continue){const next=this.scene.add.text(layout.continue.x,layout.continue.y,'繼續旅程',{fixedWidth:240,align:'center',fontFamily:'sans-serif',fontSize:'21px',color:'#fff',backgroundColor:'#285c67',padding:{y:16}}).setOrigin(.5).setDepth(181).setAlpha(0).setScrollFactor(0).setInteractive({useHandCursor:true});next.on('pointerdown',actions.onContinue);buttons.push(next)}\n    this.hudLayer.add([overlay,title,...buttons]);\n    this.scene.cameras.main.shake(victory?110:220,victory ? 0.006 : 0.012);\n    await new Promise<void>(resolve=>this.scene.tweens.add({targets:overlay,alpha:1,duration:280,onComplete:()=>resolve()}));\n    this.scene.tweens.add({targets:[title,...buttons],alpha:1,scale:1,duration:260,ease:'Back.easeOut'})\n  }\n}\n""",encoding='utf-8')

          layout_test=Path('src/presentation/battle/OutcomeLayout.test.ts')
          layout_test.write_text("""import{describe,expect,it}from'vitest';\nimport{outcomeButtonLayout}from'./OutcomeLayout';\n\ndescribe('battle outcome layout',()=>{\n  it('shows retry only after defeat',()=>{\n    expect(outcomeButtonLayout('defeat')).toEqual({retry:{x:640,y:394,primary:true}})\n  });\n\n  it('shows only journey continuation after victory',()=>{\n    const layout=outcomeButtonLayout('victory');\n    expect(layout.continue).toEqual({x:640,y:394,primary:true});expect(layout.retry).toBeUndefined()\n  });\n});\n""",encoding='utf-8')

          # Lock branch identity: upper and lower routes must never collapse to the same monster roster.
          encounter_test=Path('src/core/route/EncounterCatalog.test.ts')
          et=encounter_test.read_text(encoding='utf-8')
          marker="  it('keeps first battle as a two-enemy tutorial and later nodes varied',()=>{"
          branch_test="""  it('keeps upper and lower branch encounters distinct',()=>{\n    expect(storyEncounters['battle-2-upper']?.enemies).not.toEqual(storyEncounters['battle-2-lower']?.enemies);\n    expect(storyEncounters['battle-3-upper']?.enemies).not.toEqual(storyEncounters['battle-3-lower']?.enemies);\n    expect(storyEncounters['battle-2-upper']?.enemies).toContain('mountain-hound');\n    expect(storyEncounters['battle-2-lower']?.enemies).toContain('wayfarer-umbrella');\n    expect(storyEncounters['battle-3-lower']?.enemies).toContain('lost-monk')\n  });\n"""
          if 'keeps upper and lower branch encounters distinct' not in et:
              if marker not in et:raise SystemExit('encounter test marker missing')
              et=et.replace(marker,branch_test+marker,1)
          encounter_test.write_text(et,encoding='utf-8')
          PY

          # Transitional runtime shims and this one-shot migration must disappear from branch source.
          rm -f src/presentation/runtime/P11RuntimeWiring.ts src/presentation/runtime/ProductionRuntime.ts .github/workflows/source-cleanup.yml

      - name: Verify cleaned production source
        run: |
          test ! -e src/presentation/runtime/P11RuntimeWiring.ts
          test ! -e src/presentation/runtime/ProductionRuntime.ts
          ! grep -R -n -E 'boss-proof|multi-cover-proof|result-proof|death-proof|relay-proof|card-proof|monster-proof|outcome-proof|draw-proof|keydown-Q|keydown-W|keydown-A|keydown-S|P−|P\+|E−|E\+|setTint\(0xff5060\)|drawCommandSlots' src
      - name: Build and test final source
        run: |
          npm ci
          npm run build
          npm test
      - name: Commit final combat and route batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: finalize P11.4 combat and route runtime"
          git push origin HEAD:feat/p11-4-integration
