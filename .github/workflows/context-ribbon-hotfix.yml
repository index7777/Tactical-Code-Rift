name: Context Ribbon Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch context ribbon ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/presentation/scenes/BootScene.ts')
          s=p.read_text(encoding='utf-8')
          old="""    this.status=this.add.text(640,551,'',{fontFamily:'sans-serif',fontSize:'11px',fontStyle:'bold',color:'#e7f6f8',backgroundColor:'#07131bdd',padding:{x:10,y:5}}).setOrigin(.5).setDepth(82).setVisible(true);"""
          new="""    this.status=this.add.text(640,108,'',{fontFamily:'sans-serif',fontSize:'11px',fontStyle:'bold',color:'#e7f6f8',backgroundColor:'#07131bdd',padding:{x:10,y:5},wordWrap:{width:420,useAdvancedWrap:true}}).setOrigin(.5).setDepth(82).setVisible(false);"""
          if old not in s:
              raise SystemExit('status constructor marker missing')
          s=s.replace(old,new,1)
          s=s.replace('this.status.setText(', 'this.setStatus(')
          marker="""  }\nprivate button(x:number,y:number,w:number,label:string,fn:()=>void,color=0x263c48){"""
          helper="""  }\nprivate setStatus(message:string){const text=message.trim();this.status.setText(text);this.status.setVisible(text.length>0)}\nprivate button(x:number,y:number,w:number,label:string,fn:()=>void,color=0x263c48){"""
          if marker not in s:
              raise SystemExit('helper insertion marker missing')
          s=s.replace(marker,helper,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build exact source
        run: |
          npm ci
          npm run build
      - name: Commit source and self-delete
        run: |
          rm .github/workflows/context-ribbon-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/scenes/BootScene.ts
          git add -u .github/workflows/context-ribbon-hotfix.yml
          git commit -m "fix: hide empty context ribbon and move it above battle dock"
          git push origin HEAD:main
