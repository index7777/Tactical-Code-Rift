name: Redleaf Production Finalize

on:
  push:
    branches: [feat/redleaf-production-assets]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/redleaf-production-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Materialize approved Redleaf assets
        run: |
          set -euo pipefail
          rm -rf /tmp/redleaf-runtime
          mkdir -p /tmp/redleaf-runtime
          unzip -q .artifacts/redleaf-runtime-bundle.zip -d /tmp/redleaf-runtime
          mkdir -p public/assets/battle/generated/characters/redleaf/production
          mkdir -p docs/characters/assets
          cp /tmp/redleaf-runtime/2DCF34C5-DDFB-48ED-A5F2-E44092FE710B.jpeg docs/characters/assets/redleaf-master-approved-v1.jpg
          for f in redleaf-idle-a.png redleaf-idle-b.png redleaf-ready.png redleaf-attack-a.png redleaf-attack-b.png redleaf-hit-a.png redleaf-hit-b.png redleaf-down.png redleaf-portrait-current.png redleaf-portrait-timeline.png redleaf-slash-arc.png redleaf-slash-impact.png; do
            cp "/tmp/redleaf-runtime/$f" "public/assets/battle/generated/characters/redleaf/production/$f"
          done
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('public/assets/battle/generated/characters/redleaf/production')
          names=['redleaf-idle-a.png','redleaf-idle-b.png','redleaf-ready.png','redleaf-attack-a.png','redleaf-attack-b.png','redleaf-hit-a.png','redleaf-hit-b.png','redleaf-down.png']
          frames=[]
          for name in names:
              im=Image.open(root/name).convert('RGBA')
              scale=min(330/im.width,210/im.height,1)
              if scale<1: im=im.resize((round(im.width*scale),round(im.height*scale)),Image.Resampling.LANCZOS)
              c=Image.new('RGBA',(360,240),(0,0,0,0))
              c.alpha_composite(im,((360-im.width)//2,max(0,225-im.height)))
              c.save(root/name)
              frames.append(c)
          sheet=Image.new('RGBA',(360*4,240*2),(0,0,0,0))
          for i,im in enumerate(frames):sheet.alpha_composite(im,((i%4)*360,(i//4)*240))
          sheet.save(root/'redleaf-runtime-sprite-sheet.png')
          attack=Image.new('RGBA',(360*4,240),(0,0,0,0))
          a=frames[3];b=frames[4]
          attack.alpha_composite(a,(0,0));attack.alpha_composite(a,(360,0));attack.alpha_composite(b,(720,0));attack.alpha_composite(b,(1080,0))
          attack.save(root/'redleaf-attack-sequence.png')
          PY
      - name: Wire PD runtime and FX
        run: |
          python - <<'PY'
          from pathlib import Path
          boot=Path('src/presentation/scenes/BootScene.ts')
          s=boot.read_text(encoding='utf-8')
          old="for(const pose of ['idle-a','idle-b','ready','attack-a','attack-b','hit-a','hit-b','down'])this.load.image(`redleaf-${pose}`,`assets/battle/generated/characters/redleaf/redleaf-${pose}.svg`);"
          new="for(const pose of ['idle-a','idle-b','ready','attack-a','attack-b','hit-a','hit-b','down'])this.load.image(`redleaf-${pose}`,`assets/battle/generated/characters/redleaf/production/redleaf-${pose}.png`);this.load.image('fx-redleaf-slash-arc','assets/battle/generated/characters/redleaf/production/redleaf-slash-arc.png');this.load.image('fx-redleaf-slash-impact','assets/battle/generated/characters/redleaf/production/redleaf-slash-impact.png');"
          if old not in s: raise SystemExit('redleaf pose preload marker missing')
          s=s.replace(old,new,1)
          old2="for(const name of ['heroine','redleaf']){this.load.image(`portrait-${name}-current`,`assets/battle/portraits/${name}-p11-4-current.svg`);this.load.image(`portrait-${name}-timeline`,`assets/battle/portraits/${name}-p11-4-timeline.svg`)};"
          new2="this.load.image('portrait-heroine-current','assets/battle/portraits/heroine-p11-4-current.svg');this.load.image('portrait-heroine-timeline','assets/battle/portraits/heroine-p11-4-timeline.svg');this.load.image('portrait-redleaf-current','assets/battle/generated/characters/redleaf/production/redleaf-portrait-current.png');this.load.image('portrait-redleaf-timeline','assets/battle/generated/characters/redleaf/production/redleaf-portrait-timeline.png');"
          if old2 not in s: raise SystemExit('redleaf portrait preload marker missing')
          s=s.replace(old2,new2,1)
          boot.write_text(s,encoding='utf-8')

          action=Path('src/presentation/battle/ActionPresenter.ts')
          a=action.read_text(encoding='utf-8')
          a=a.replace("if(actorId==='PC')return{main:0x9f8cff,edge:0xe9e3ff,trail:0x4b3b7e};\n    return{main:0x9fe8ff,edge:0xffffff,trail:0x4b9ab5};","if(actorId==='PC')return{main:0x9f8cff,edge:0xe9e3ff,trail:0x4b3b7e};\n    if(actorId==='PD')return{main:0xe53646,edge:0xfff1cf,trail:0x7d1829};\n    return{main:0x9fe8ff,edge:0xffffff,trail:0x4b9ab5};",1)
          a=a.replace("if(!actor.sprite||!['PB','PC'].includes(actorId))return;","if(!actor.sprite||!['PB','PC','PD'].includes(actorId))return;",1)
          a=a.replace("if(actorId==='PC'){\n      this.spawnAfterimage", "if(actorId==='PD'){\n      this.spawnAfterimage(actor,direction,palette.main,18,.34);this.spawnAfterimage(actor,direction,palette.trail,36,.2);\n      const arc=this.spawnFxImage('fx-redleaf-slash-arc',actor.root.x+direction*46,actor.root.y-8,86,{scale:.22,alpha:.34,flipX:direction<0,blendMode:Phaser.BlendModes.ADD});\n      if(arc)this.scene.tweens.add({targets:arc,alpha:0,scale:.28,duration:150,ease:'Quad.easeOut',onComplete:()=>arc.destroy()});\n    }else if(actorId==='PC'){\n      this.spawnAfterimage",1)
          a=a.replace("if(!['PB','PC'].includes(actorId))return;\n    const p=this.techniquePalette(actorId);\n    if(actorId==='PB'){","if(!['PB','PC','PD'].includes(actorId))return;\n    const p=this.techniquePalette(actorId);\n    if(actorId==='PD'){\n      const arc=this.spawnFxImage('fx-redleaf-slash-arc',x,y-8,112,{scale:cardId==='heavy'?.72:.56,alpha:.94,flipX:direction<0,blendMode:Phaser.BlendModes.ADD});\n      const impact=this.spawnFxImage('fx-redleaf-slash-impact',x+direction*8,y+18,116,{scale:cardId==='break'?.55:.42,alpha:.86,flipX:direction<0,blendMode:Phaser.BlendModes.ADD});\n      if(arc)this.scene.tweens.add({targets:arc,scale:(arc.scaleX||1)*1.15,alpha:0,duration:190,ease:'Expo.easeOut',onComplete:()=>arc.destroy()});\n      if(impact)this.scene.tweens.add({targets:impact,scale:(impact.scaleX||1)*1.25,alpha:0,duration:210,ease:'Cubic.easeOut',onComplete:()=>impact.destroy()});\n      this.debrisBurst(x,y,p.main,direction,cardId==='heavy'?12:8,76);\n    }else if(actorId==='PB'){",1)
          action.write_text(a,encoding='utf-8')

          doc=Path('docs/characters/redleaf.md')
          d=doc.read_text(encoding='utf-8') if doc.exists() else '# Character Master Spec：紅葉／PD\n'
          if 'redleaf-master-approved-v1.jpg' not in d:
              d += "\n## Approved visual source\n\n- Master board：`docs/characters/assets/redleaf-master-approved-v1.jpg`（使用者指定視覺母版）\n- Runtime：`public/assets/battle/generated/characters/redleaf/production/`\n- PD runtime 已接 idle / ready / attack / hit / down、Current Actor / timeline portraits、紅葉專屬斬擊與落點 FX。\n- `redleaf-runtime-sprite-sheet.png` 保存 runtime sheet；`redleaf-attack-sequence.png` 保存透明 attack sequence。\n"
          doc.write_text(d,encoding='utf-8')
          PY
      - name: Audit Redleaf hookup
        run: |
          set -euo pipefail
          test -f docs/characters/assets/redleaf-master-approved-v1.jpg
          test -f public/assets/battle/generated/characters/redleaf/production/redleaf-runtime-sprite-sheet.png
          test -f public/assets/battle/generated/characters/redleaf/production/redleaf-attack-sequence.png
          test -f public/assets/battle/generated/characters/redleaf/production/redleaf-portrait-current.png
          grep -q "redleaf/production/redleaf-.*png" src/presentation/scenes/BootScene.ts
          grep -q "actorId==='PD'" src/presentation/battle/ActionPresenter.ts
          grep -q "fx-redleaf-slash-arc" src/presentation/battle/ActionPresenter.ts
          if grep -q "generated/characters/redleaf/redleaf-.*svg" src/presentation/scenes/BootScene.ts; then echo 'legacy Redleaf SVG runtime still wired'; exit 1; fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit production assets and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/redleaf-production-finalize.yml
          git add -A
          git commit -m "feat: wire approved Redleaf production assets into PD runtime"
          git push origin HEAD:feat/redleaf-production-assets
